services:
  - type: web
    name: shiryou-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 2
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # サブスクLLMゲートウェイ (2026-08-10)。両方設定すると Claude 呼び出しが
      # 社長PCワーカー経由 (サブスク枠・課金ゼロ) になる。未設定なら従来どおり。
      # 値は otona-manabi-tv の SUPABASE_URL / SUPABASE_KEY と同じもの。
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
